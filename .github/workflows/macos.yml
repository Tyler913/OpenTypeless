# Builds the macOS app on a macOS runner: runs the tests, then packages the ad-hoc-signed app zip
# (download it from the run's Artifacts).
#
#   ci.yml calls it          when a push or pull request changes macos/
#   release.yml calls it     for a tag like `1.0.2`
#   Actions tab → macOS build → Run workflow   a manual run
name: macOS build

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (arm64)
    runs-on: macos-26
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v7

      # Package.swift borrows Xcode's macro plugins when DEVELOPER_DIR is unset and the Command Line Tools
      # are installed, which is the case on the runner. Point it at the selected Xcode instead.
      - name: Use the runner's Xcode
        run: |
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          xcodebuild -version
          swift --version

      # The same scripts used locally.
      - name: Test
        run: scripts/test.sh

      # Releases are signed with a stable self-signed certificate so that in-app updates keep macOS permissions
      # (see scripts/create-release-cert.sh). Without the secrets, e.g. for pull requests, the zip is signed ad hoc.
      - name: Import the release signing certificate
        env:
          CERTIFICATE: ${{ secrets.MACOS_SIGNING_CERTIFICATE }}
          PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if [[ -z "$CERTIFICATE" ]]; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              echo "::warning::No MACOS_SIGNING_CERTIFICATE secret: this release is signed ad hoc, so macOS asks for permissions again after users update"
            fi
            exit 0
          fi
          keychain="$RUNNER_TEMP/release-signing.keychain-db"
          keychain_password="$(uuidgen)"
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/release.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/release.p12" -k "$keychain" -P "$PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/release.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # A self-signed certificate has to be trusted for code signing on this runner before codesign uses it.
          security find-certificate -a -p "$keychain" > "$RUNNER_TEMP/release.pem"
          sudo security authorizationdb write com.apple.trust-settings.admin allow
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/release.pem"
          identity="$(security find-identity -v -p codesigning "$keychain" | grep -Eo '[0-9A-F]{40}' | head -1)"
          [[ -n "$identity" ]] || { security find-identity -p codesigning "$keychain"; echo "::error::The certificate can't be used for code signing"; exit 1; }
          echo "OPENTYPELESS_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build and package
        run: scripts/build-app.sh --package

      - uses: actions/upload-artifact@v7
        with:
          name: OpenTypeless-macos-arm64
          path: macos/dist/*.zip
          if-no-files-found: error
          compression-level: 0 # already a zip
