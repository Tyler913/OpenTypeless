# Pushing a version tag builds both apps and drafts one GitHub Release titled "OpenTypeless V<version>" with
# everything attached. For a tag 1.0.2 (or v1.0.2 / V1.0.2):
#
#   OpenTypeless-1.0.2-macOS-arm64.dmg            Mac with Apple silicon: open, drag the app onto Applications
#   OpenTypeless-1.0.2-macOS-x64.dmg              Intel Mac
#   OpenTypeless-1.0.2-windows-x64-setup.exe      Windows installer (Start menu, Settings → Apps, uninstaller)
#   OpenTypeless-1.0.2-windows-arm64-setup.exe    Windows on ARM installer
#   OpenTypeless-1.0.2-windows-x64.zip            portable: unzip anywhere and run
#   OpenTypeless-1.0.2-windows-arm64.zip
#   OpenTypeless-1.0.2-macOS-arm64.zip            the same apps as the disk images, for the in-app updater and Homebrew
#   OpenTypeless-1.0.2-macOS-x64.zip              (the Windows updater uses the portable zips)
#
# The Mac apps are signed with the release certificate. The release is a draft, so nothing is public until you review
# and publish it; it's marked as the latest release then. Bump the version first (macos/scripts/build-app.sh,
# windows/Directory.Build.props); the release fails if any file is missing or doesn't match the tag.
name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[vV][0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  macos:
    name: macOS
    uses: ./.github/workflows/macos.yml
    secrets: inherit # the release signing certificate

  windows:
    name: Windows
    uses: ./.github/workflows/windows.yml

  release:
    name: Draft release
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: OpenTypeless-* # not the UI snapshots
          merge-multiple: true

      - name: Check the files match the tag's version
        id: version
        run: |
          version="${GITHUB_REF_NAME#[vV]}"
          ls dist
          for file in macOS-arm64.dmg macOS-x64.dmg macOS-arm64.zip macOS-x64.zip \
                      windows-x64.zip windows-arm64.zip windows-x64-setup.exe windows-arm64-setup.exe; do
            [[ -f "dist/OpenTypeless-$version-$file" ]] || { echo "::error::No OpenTypeless-$version-$file for tag $GITHUB_REF_NAME: bump the version in both apps and tag again"; exit 1; }
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v3
        with:
          name: OpenTypeless V${{ steps.version.outputs.version }}
          draft: true
          make_latest: true
          files: |
            dist/*.dmg
            dist/*.exe
            dist/*.zip
          fail_on_unmatched_files: true
