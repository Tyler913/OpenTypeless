# Pushing a version tag builds that app and drafts a GitHub Release with its zips attached:
#
#   1.0.2           macOS: OpenTypeless-1.0.2-macOS-arm64.zip, marked as the latest release once published
#   1.0.2-windows   Windows: the x64 and ARM64 zips, never marked latest (that belongs to the macOS release)
#
# Releases are drafts, so nothing is public until you review and publish them. Bump the version first
# (macos/scripts/build-app.sh, windows/Directory.Build.props); the release fails if the zips don't match the tag.
name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-windows'

permissions:
  contents: read

jobs:
  macos:
    name: macOS
    if: ${{ !endsWith(github.ref_name, '-windows') }}
    uses: ./.github/workflows/macos.yml

  windows:
    name: Windows
    if: endsWith(github.ref_name, '-windows')
    uses: ./.github/workflows/windows.yml

  release:
    name: Draft release
    needs: [macos, windows]
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Check the zips match the tag's version
        run: |
          version="${GITHUB_REF_NAME%-windows}"
          ls dist
          for zip in dist/*.zip; do
            [[ "$zip" == *"-$version-"* ]] || { echo "::error::$zip doesn't match tag $GITHUB_REF_NAME: bump the version and tag again"; exit 1; }
          done

      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          make_latest: ${{ endsWith(github.ref_name, '-windows') && 'false' || 'true' }}
          files: dist/*.zip
          fail_on_unmatched_files: true
