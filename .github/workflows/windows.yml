# Builds the Windows app in the cloud, since WinUI 3 only compiles on Windows.
#
#   push / pull request to `windows`  tests, then zips for x64 and ARM64 (download them from the run's Artifacts)
#   push a tag like `1.0.1-windows`   the same, then a draft GitHub Release with both zips attached
#   Actions tab → Run workflow        a manual run
name: Windows build

on:
  push:
    branches: [windows]
    tags: ['*-windows']
  pull_request:
    branches: [windows]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # The same script used locally: runs the tests, publishes the app and CLI self-contained, zips them.
      - name: Test, build and package
        shell: pwsh
        run: scripts/build.ps1 -Package -Arch ${{ matrix.arch }} *>&1 | Tee-Object -FilePath build.log

      # Job logs need a GitHub sign-in to read, but annotations show on the run page for everyone.
      - name: Show the end of the build output on the run page
        if: failure()
        shell: pwsh
        run: |
          $tail = (Get-Content build.log -Tail 80 -ErrorAction SilentlyContinue) -join "`n"
          $escaped = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
          Write-Output "::error title=Build (${{ matrix.arch }}) failed::$escaped"

      - uses: actions/upload-artifact@v7
        with:
          name: OpenTypeless-windows-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0 # already a zip

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # A draft, so nothing is public until it's reviewed; never marked "latest", which belongs to the macOS release.
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          make_latest: 'false'
          files: dist/*.zip
          fail_on_unmatched_files: true
