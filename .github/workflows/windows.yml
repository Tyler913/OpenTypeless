# Builds the Windows app in the cloud, since WinUI 3 only compiles on Windows, natively for x64 and for ARM64 (each
# on its own runner): runs the tests (and, once, the performance budgets), then packages the portable zip and the
# installer, and installs, starts and uninstalls the installer's app (download both from the run's Artifacts).
#
#   ci.yml calls it          when a push or pull request changes windows/
#   release.yml calls it     for a version tag like `1.0.2` (together with the macOS build)
#   Actions tab → Windows build → Run workflow   a manual run
name: Windows build

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r ../scripts/ci/requirements.txt

      # The same script used locally: runs the tests, publishes the app and CLI self-contained, zips them.
      - name: Test, build and package
        id: build
        shell: pwsh
        run: scripts/build.ps1 -Package -Arch ${{ matrix.arch }} *>&1 | Tee-Object -FilePath build.log

      # Job logs need a GitHub sign-in to read, but annotations show on the run page for everyone.
      - name: Show the end of the build output on the run page
        if: failure() && steps.build.outcome == 'failure'
        shell: pwsh
        run: |
          $tail = (Get-Content build.log -Tail 80 -ErrorAction SilentlyContinue) -join "`n"
          $escaped = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
          Write-Output "::error title=Build (${{ matrix.arch }}) failed::$escaped"

      # Exercise the actual portable ZIP on both native architectures, not just the publish staging folder. It is
      # unpacked into a folder with a space and Chinese in its name, like many users' folders.
      - name: Check portable package and all UI snapshots
        timeout-minutes: 15
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          $zip = (Resolve-Path "dist\OpenTypeless-$version-windows-${{ matrix.arch }}.zip").Path
          $portable = Join-Path $env:RUNNER_TEMP 'OpenTypeless 便携版'
          Expand-Archive $zip -DestinationPath $portable
          $exe = Join-Path $portable 'OpenTypeless\OpenTypeless.exe'
          if (-not (Test-Path $exe)) { throw 'Portable ZIP has no OpenTypeless.exe' }
          python ../scripts/ci/run_snapshots.py $exe "$env:RUNNER_TEMP/snapshots"
          if ($LASTEXITCODE) { throw 'Native UI rendering smoke test failed' }

      # A minute of synthetic speech through the portable ZIP's OpenTypeless.Cli.exe (--transcribe-file --realtime)
      # against a local fake provider (scripts/ci/fake_provider.py): chunking at pauses, a retry after a 503, joining
      # and the streamed clean-up, in the self-contained release build users get. No API key, no network.
      - name: Dictate through the packaged app
        timeout-minutes: 8
        shell: pwsh
        run: |
          $cli = Join-Path $env:RUNNER_TEMP 'OpenTypeless 便携版\OpenTypeless\OpenTypeless.Cli.exe'
          python ../scripts/ci/run_dictation.py $cli "$env:RUNNER_TEMP\dictation\听写 测试"
          if ($LASTEXITCODE) { throw 'Dictation through the packaged app failed' }

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: snapshots-windows-${{ matrix.arch }}
          path: ${{ runner.temp }}/snapshots
          if-no-files-found: warn

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dictation-windows-${{ matrix.arch }}
          path: ${{ runner.temp }}/dictation
          if-no-files-found: warn

      # Time budgets for the work that runs while you dictate and on the UI thread, in a Release build like the app's
      # (tests/TypelessCore.Tests/PerformanceTests.cs). The timings are on the run's summary page. Once is enough,
      # on the x64 runner.
      - name: Performance
        if: matrix.arch == 'x64'
        shell: pwsh
        run: scripts/perf.ps1

      # What a user gets from the installer, run silently the way WinGet runs it: the app in its folder with a Start
      # menu entry, a desktop shortcut and a Settings → Apps entry for this version; the installed app starts and stays
      # up; and uninstalling removes all of it, the login entry the app adds on its first run included.
      - name: Check the installer
        timeout-minutes: 8
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          $setup = (Resolve-Path "dist\OpenTypeless-$version-windows-${{ matrix.arch }}-setup.exe").Path
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\OpenTypeless'
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\OpenTypeless_is1'
          $startMenu = Join-Path ([Environment]::GetFolderPath('Programs')) 'OpenTypeless.lnk'
          $desktop = Join-Path ([Environment]::GetFolderPath('Desktop')) 'OpenTypeless.lnk'
          function Fail($message) { Write-Output "::error title=Installer (${{ matrix.arch }})::$message"; exit 1 }

          $install = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$env:RUNNER_TEMP\install.log" -Wait -PassThru
          if ($install.ExitCode) { Get-Content "$env:RUNNER_TEMP\install.log" -Tail 40; Fail "setup exited with $($install.ExitCode)" }
          if (-not (Test-Path "$dir\OpenTypeless.exe")) { Fail "no OpenTypeless.exe in $dir" }
          if (-not (Test-Path "$dir\unins000.exe")) { Fail 'no uninstaller' }
          if (-not (Test-Path $startMenu)) { Fail 'no Start menu shortcut' }
          if (-not (Test-Path $desktop)) { Fail 'no desktop shortcut' }
          $entry = Get-ItemProperty $key -ErrorAction SilentlyContinue
          if (-not $entry) { Fail 'no Settings → Apps entry' }
          if ($entry.DisplayVersion -ne $version) { Fail "the Apps entry says $($entry.DisplayVersion), not $version" }

          $app = Start-Process "$dir\OpenTypeless.exe" -PassThru
          Start-Sleep -Seconds 15
          if ($app.HasExited) { Fail "the installed app quit by itself (exit code $($app.ExitCode))" }

          $uninstall = Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$env:RUNNER_TEMP\uninstall.log" -Wait -PassThru
          if ($uninstall.ExitCode) { Fail "uninstaller exited with $($uninstall.ExitCode)" }
          # The child uninstaller can remove the folder before shortcuts/registry entries. Wait for all
          # postconditions together, then fail on any leftovers; never delete them to make the test pass.
          for ($i = 0; $i -lt 90; $i++) {
            $login = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name OpenTypeless -ErrorAction SilentlyContinue
            if (-not ((Test-Path $dir) -or (Test-Path $startMenu) -or (Test-Path $desktop) -or
                      (Test-Path $key) -or $login -or (Get-Process OpenTypeless -ErrorAction SilentlyContinue))) { break }
            Start-Sleep -Seconds 1
          }
          if (Test-Path $dir) { Fail "$dir is still there after uninstalling: $((Get-ChildItem $dir -Recurse -Name) -join ', ')" }
          if (Test-Path $startMenu) { Fail 'the Start menu shortcut is still there' }
          if (Test-Path $desktop) { Fail 'the desktop shortcut is still there' }
          if (Test-Path $key) { Fail 'the Apps entry is still there' }
          if (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name OpenTypeless -ErrorAction SilentlyContinue) { Fail 'the login entry is still there' }
          if (Get-Process OpenTypeless -ErrorAction SilentlyContinue) { Fail 'the app is still running' }
          Write-Output "The installer installs, the app starts, and the uninstaller removes it"

      - name: Collect Windows diagnostics
        if: always()
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'windows-diagnostics'
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item build.log, test-results\* "$out" -Recurse -ErrorAction SilentlyContinue
          Copy-Item "$env:RUNNER_TEMP\install.log", "$env:RUNNER_TEMP\uninstall.log" "$out" -ErrorAction SilentlyContinue
          # Every error and warning in the Application log during this job: a native crash (e.g. 0xC000027B from an
          # exception in a dispatcher callback) never reaches the app's own log, only Application Error / WER entries.
          $events = @(Get-WinEvent -FilterHashtable @{ LogName = 'Application'; Level = 1, 2, 3; StartTime = (Get-Date).AddHours(-2) } -ErrorAction SilentlyContinue)
          Write-Output "$($events.Count) Application log errors/warnings"
          $events | Select-Object -First 40 | Format-List TimeCreated, ProviderName, Id, Message | Out-File -Width 400 "$out\events.log"
          Get-Content "$out\events.log" -TotalCount 120

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: diagnostics-windows-${{ matrix.arch }}
          path: ${{ runner.temp }}/windows-diagnostics
          if-no-files-found: warn

      - uses: actions/upload-artifact@v7
        with:
          name: OpenTypeless-windows-${{ matrix.arch }}
          path: |
            windows/dist/*.zip
            windows/dist/*.exe
          if-no-files-found: error
          compression-level: 0 # already compressed
