# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.10.0.schema.json

PackageIdentifier: TylerHong.OpenTypeless
PackageVersion: @VERSION@
InstallerType: zip
NestedInstallerType: portable
NestedInstallerFiles:
- RelativeFilePath: OpenTypeless\OpenTypeless.exe
# The exe needs the DLLs next to it, so the folder goes on PATH rather than a symlink to the exe.
ArchiveBinariesDependOnPath: true
MinimumOSVersion: 10.0.19041.0
ReleaseDate: @RELEASE_DATE@
Installers:
- Architecture: x64
  InstallerUrl: https://github.com/Tyler913/OpenTypeless/releases/download/@TAG@/OpenTypeless-@VERSION@-windows-x64.zip
  InstallerSha256: @WINDOWS_X64_SHA256@
- Architecture: arm64
  InstallerUrl: https://github.com/Tyler913/OpenTypeless/releases/download/@TAG@/OpenTypeless-@VERSION@-windows-arm64.zip
  InstallerSha256: @WINDOWS_ARM64_SHA256@
ManifestType: installer
ManifestVersion: 1.10.0
